<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Login - VitalSync</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/registro.css">
</head>

<body>
  <div class="banner">
    <div class="container">
      <div class="banner-content">
        <div class="banner-icon">
          <i class="fas fa-heart-pulse"></i>
        </div>

        <h2>
          <i class="fas fa-user-lock"></i>
          Acceso <span class="highlight">VitalSync</span>
        </h2>

        <p class="banner-subtitle text-white">
          Inicie sesión para acceder al sistema
        </p>
      </div>
    </div>
  </div>

  <main class="container">
    <div id="alerta" class="alert d-none" role="alert"></div>

    <div class="form-container" style="max-width: 520px; margin: 0 auto;">
      <h1 class="text-center mb-4">
        <i class="fas fa-right-to-bracket me-2"></i>Iniciar sesión
      </h1>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="correo" class="form-label">
            Correo electrónico <span class="required">*</span>
          </label>

          <input
            type="email"
            class="form-control"
            id="correo"
            name="correo"
            required
            placeholder="ejemplo@correo.com"
            autocomplete="email"
          />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">
            Contraseña <span class="required">*</span>
          </label>

          <div class="input-group">
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              required
              minlength="6"
              placeholder="Ingrese su contraseña"
              autocomplete="current-password"
            />

            <button type="button" class="btn btn-secondary" id="verPassword">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="d-grid gap-2 mt-4">
          <button type="submit" class="btn btn-primary" id="btnLogin">
            <i class="fas fa-right-to-bracket me-2"></i>Entrar
          </button>

          <button type="button" class="btn btn-secondary" id="btnCrearCuenta">
            <i class="fas fa-user-plus me-2"></i>Crear cuenta
          </button>

          <a href="index.html" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-2"></i>Volver al inicio
          </a>
        </div>
      </form>
    </div>
  </main>

  <script type="module" src="assets/js/login.js"></script>
</body>
</html>

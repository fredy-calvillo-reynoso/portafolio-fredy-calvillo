<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro Médico - VitalSync</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/registro.css" />
</head>

<body>
  <div class="banner">
    <div class="container">
      <div class="banner-content">
        <div class="banner-icon">
          <i class="fas fa-heart-pulse"></i>
        </div>
        <h2>
          <i class="fas fa-file-medical"></i>
          Registro Médico <span class="highlight">Paciente</span>
        </h2>
        <p class="banner-subtitle text-white">Complete la información requerida</p>
      </div>
    </div>
  </div>

  <main class="container">
    <div id="alerta" class="alert d-none" role="alert"></div>

<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
  <h1 class="mb-0">Registro de Paciente</h1>

  <div class="d-flex flex-wrap gap-2">
    <a href="index.html" class="btn btn-secondary">
      <i class="fas fa-arrow-left me-1"></i> Inicio
    </a>

    <button type="button" class="btn btn-outline-danger" id="btnCerrarSesion">
      <i class="fas fa-right-from-bracket me-1"></i> Cerrar sesión
    </button>
  </div>
</div>

      <form id="patientForm" novalidate>
        <div class="row g-3">

          <div class="col-md-6">
            <label for="nombre" class="form-label">
              Nombre <span class="required">*</span>
            </label>
            <input
              type="text"
              class="form-control"
              name="nombre"
              id="nombre"
              required
              pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+"
              title="Solo se permiten letras y espacios"
              autocomplete="given-name"
            />
          </div>

          <div class="col-md-6">
            <label for="apellidos" class="form-label">
              Apellidos <span class="required">*</span>
            </label>
            <input
              type="text"
              class="form-control"
              name="apellidos"
              id="apellidos"
              required
              pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+"
              title="Solo se permiten letras y espacios"
              autocomplete="family-name"
            />
          </div>

          <div class="col-md-6">
            <label for="edad" class="form-label">
              Edad <span class="required">*</span>
            </label>
            <input
              type="number"
              class="form-control"
              name="edad"
              id="edad"
              min="0"
              max="120"
              required
              inputmode="numeric"
              title="Ingrese una edad válida entre 0 y 120"
            />
          </div>

          <div class="col-md-6">
            <label for="fechaNacimiento" class="form-label">
              Fecha de nacimiento
            </label>
            <input
              type="date"
              class="form-control"
              name="fechaNacimiento"
              id="fechaNacimiento"
            />
          </div>

          <div class="col-12">
            <label for="direccion" class="form-label">
              Dirección <span class="required">*</span>
            </label>
            <input
              type="text"
              class="form-control"
              name="direccion"
              id="direccion"
              required
              pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ0-9\s#.,\-]+"
              title="Solo se permiten letras, números y signos básicos como # . , -"
              autocomplete="street-address"
            />
          </div>

          <div class="col-12 mt-2">
            <label class="form-label">
              Ubicación del Paciente
            </label>

            <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
              <button type="button" class="btn btn-success" id="obtenerUbicacion">
                <i class="fas fa-location-dot me-1"></i> Obtener ubicación
              </button>

              <button type="button" class="btn btn-outline-secondary" id="detenerUbicacion" disabled>
                <i class="fas fa-stop me-1"></i> Detener
              </button>

              <span id="ubicacionStatus" class="text-muted">Aún no detectada</span>
            </div>

            <div class="row g-2">
              <div class="col-md-3">
                <input
                  type="text"
                  class="form-control"
                  name="latitud"
                  id="latitud"
                  placeholder="Latitud"
                  readonly
                />
              </div>

              <div class="col-md-3">
                <input
                  type="text"
                  class="form-control"
                  name="longitud"
                  id="longitud"
                  placeholder="Longitud"
                  readonly
                />
              </div>

              <div class="col-md-3">
                <input
                  type="text"
                  class="form-control"
                  name="geoAccuracy"
                  id="geoAccuracy"
                  placeholder="Precisión (m)"
                  readonly
                />
              </div>

              <div class="col-md-3">
                <input
                  type="text"
                  class="form-control"
                  name="geoTimestamp"
                  id="geoTimestamp"
                  placeholder="Fecha/hora"
                  readonly
                />
              </div>
            </div>

            <small class="text-muted d-block mt-1">
              Arrastra el marcador para afinar la posición.
            </small>

            <div id="mapa" style="height: 320px; border-radius: 10px; margin-top: 10px;"></div>
          </div>

          <div class="col-md-6">
            <label for="telefonoEmergencias" class="form-label">
              Teléfono de Emergencias <span class="required">*</span>
            </label>
            <input
              type="tel"
              class="form-control"
              name="telefonoEmergencias"
              id="telefonoEmergencias"
              required
              pattern="[0-9]{10}"
              maxlength="10"
              inputmode="numeric"
              title="Ingrese un número de teléfono de 10 dígitos"
              autocomplete="tel"
            />
          </div>

          <div class="col-md-6">
            <label for="telefonoFamiliar" class="form-label">
              Teléfono del Familiar a cargo <span class="required">*</span>
            </label>
            <input
              type="tel"
              class="form-control"
              name="telefonoFamiliar"
              id="telefonoFamiliar"
              required
              pattern="[0-9]{10}"
              maxlength="10"
              inputmode="numeric"
              title="Ingrese un número de teléfono de 10 dígitos"
              autocomplete="tel"
            />
          </div>

          <div class="col-md-6">
            <label for="tipoSangre" class="form-label">
              Tipo de Sangre <span class="required">*</span>
            </label>
            <select class="form-control" name="tipoSangre" id="tipoSangre" required>
              <option value="">Seleccione...</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
            </select>
          </div>

          <div class="col-md-6">
            <label for="genero" class="form-label">Género</label>
            <select class="form-control" name="genero" id="genero">
              <option value="">Seleccione...</option>
              <option value="Masculino">Masculino</option>
              <option value="Femenino">Femenino</option>
              <option value="Otro">Otro</option>
              <option value="Prefiero no decir">Prefiero no decir</option>
            </select>
          </div>

          <div class="col-12">
            <label for="enfermedades" class="form-label">
              Enfermedades del Paciente
            </label>
            <textarea
              class="form-control"
              name="enfermedades"
              id="enfermedades"
              rows="2"
              placeholder="Ejemplo: diabetes, hipertensión"
              title="Solo se permiten letras, números, comas, puntos y guiones"
            ></textarea>
          </div>

          <div class="col-12">
            <label class="form-label mt-2">
              ¿Alguna alergia a algo? <span class="required">*</span>
            </label>

            <div>
              <input type="radio" name="alergia" value="Sí" id="alergiaSi" />
              <label for="alergiaSi" class="radio-label">Sí</label>

              <input class="ms-3" type="radio" name="alergia" value="No" id="alergiaNo" checked />
              <label for="alergiaNo" class="radio-label">No</label>
            </div>

            <div id="alergiaDescripcionContainer" class="mt-2" style="display: none;">
              <input
                type="text"
                class="form-control"
                name="alergiaDescripcion"
                id="alergiaDescripcion"
                placeholder="Describa la alergia"
                pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ0-9\s,.\-]+"
                title="Solo se permiten letras, números, comas, puntos y guiones"
              />
            </div>
          </div>

          <div class="col-12">
            <label class="form-label mt-2">
              ¿Alergia a algún medicamento? <span class="required">*</span>
            </label>

            <div>
              <input type="radio" name="alergiaMedicamento" value="Sí" id="alergiaMedSi" />
              <label for="alergiaMedSi" class="radio-label">Sí</label>

              <input class="ms-3" type="radio" name="alergiaMedicamento" value="No" id="alergiaMedNo" checked />
              <label for="alergiaMedNo" class="radio-label">No</label>
            </div>

            <div id="medicamentosContainer" class="mt-2" style="display: none;">
              <div id="medicamentosInputs"></div>

              <button type="button" class="btn btn-secondary btn-sm mt-2" id="agregarMedicamento">
                <i class="fas fa-plus me-1"></i> Agregar otro medicamento
              </button>
            </div>
          </div>

          <div class="col-12 text-center mt-4">
            <button type="submit" class="btn btn-primary me-2" id="btnSubmit">
              <i class="fas fa-save me-2"></i>Guardar
            </button>

            <a href="monitoreo.html" class="btn btn-secondary">
              <i class="fas fa-heartbeat me-2"></i>Ver monitoreo
            </a>
          </div>

        </div>
      </form>
    </div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script type="module" src="assets/js/route-guard.js"></script>
<script type="module" src="assets/js/registro-paciente.js"></script>
</body>
</html>

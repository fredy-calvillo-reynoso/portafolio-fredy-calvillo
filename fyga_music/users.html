<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FYGA — Panel de Control</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    /* Badge rol */
    .badge {
      display: inline-block;
      padding: 0.25rem 0.7rem;
      border-radius: 50px;
      font-size: 0.78rem;
      font-weight: 700;
      background: var(--accent);
      color: #fff;
    }
    .badge.user { background: var(--bg-card-alt); color: var(--text-secondary); }
  </style>
</head>
<body>


  <header class="header">
    <div class="header__logo">
      <i class="bi bi-speedometer2"></i> Panel FYGA
    </div>
    <div class="header__actions">
      <img id="adminPhoto" src="" alt="foto" class="header__user-photo" style="display:none">
      <span class="header__user-name" id="adminName"></span>
      <a href="index.html" class="btn btn-outline">
        <i class="bi bi-house-door"></i> Sitio
      </a>
      <button class="btn btn-outline" id="btnLogout">
        <i class="bi bi-box-arrow-right"></i> Salir
      </button>
    </div>
  </header>


  <div class="admin-wrapper">
    <h2 class="admin-title">
      <i class="bi bi-people-fill"></i> Gestión de Usuarios
    </h2>

    <div class="table-box">
      <table class="admin-table">
        <thead>
          <tr>
            <th>UID</th>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Rol</th>
            <th>Registro</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <tr>
            <td colspan="6" style="color:var(--text-secondary);padding:2rem">
              Cargando usuarios…
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div style="margin-top:1.5rem">
      <a href="index.html" class="btn btn-accent">
        <i class="bi bi-house-door"></i> Volver al sitio
      </a>
    </div>
  </div>


  <div id="editModal" class="modal-admin-overlay d-none">
    <div class="modal-admin-box">
      <h4><i class="bi bi-pencil-square"></i> Editar usuario</h4>
      <form id="editForm">
        <input type="hidden" id="editUid">
        <div class="form-group">
          <label for="editNombre">Nombre</label>
          <input type="text" id="editNombre" class="form-input" required>
        </div>
        <div class="form-group">
          <label for="editCorreo">Correo</label>
          <input type="email" id="editCorreo" class="form-input" required>
        </div>
        <div style="display:flex;gap:0.8rem;margin-top:1rem">
          <button type="submit" class="btn btn-accent" style="flex:1">
            <i class="bi bi-check-circle"></i> Guardar
          </button>
          <button type="button" class="btn btn-outline" onclick="closeEditModal()" style="flex:1">
            Cancelar
          </button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="assets/js/admin.js"></script>
</body>
</html>

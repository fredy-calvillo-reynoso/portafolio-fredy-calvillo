    <!-- Preconnect / dns-prefetch a orígenes de Firebase y Google APIs.
         Se cargan solo cuando se usan (login, pedidos, perfil, admin),
         pero al anticipar la conexión se evita el costo de la negociación
         DNS/TLS en el momento en que realmente se necesiten. -->
    <link rel="preconnect" href="https://sense-vision-a8451.firebaseapp.com" crossorigin />
    <link rel="dns-prefetch" href="https://sense-vision-a8451.firebaseapp.com" />
    <link rel="preconnect" href="https://apis.google.com" crossorigin />
    <link rel="dns-prefetch" href="https://apis.google.com" />

    <title>Sense Vision</title>
  </head>
